server {
    listen 80;
    server_name _;

    # ── AI 对话推理：直连 Python vago-ai（消除 SSE 代理链路）────────────────
    # 覆盖：POST /api/v1/ai/chat   （非流式对话）
    #       POST /api/v1/ai/chat/stream  （流式 SSE）
    # JWT 鉴权由 Python 侧 get_current_user_uuid 依赖自行验证。
    location /api/v1/ai/chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # SSE 必须禁用缓冲，否则 Nginx 会攒包导致打字机效果失效
        proxy_buffering off;
        proxy_cache off;

        # 保持长连接（SSE 需要）
        proxy_set_header Connection '';

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # SSE 连接可能持续数分钟，超时适当延长
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 其他 API：走 Java 单体后端 ───────────────────────────────────────────
    # 含：/api/v1/ai/plans/*（行程保存）、/api/v1/travel/*、/api/v1/user/* 等
    location /api/v1 {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── 前端静态文件 ─────────────────────────────────────────────────────────
    location / {
        root /var/www/vago-web/dist;
        try_files $uri $uri/ /index.html;
        expires 7d;
        add_header Cache-Control "public";
    }
}
