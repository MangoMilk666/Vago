spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/vago_user?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "your_password"

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

vago:
  jwt:
    secret-key: vago_user_dev_secret_key_please_change_in_prod
    # Access Token 有效期：2 小时（毫秒）
    access-token-ttl: 7200000
    # Refresh Token 有效期：30 天（毫秒）
    refresh-token-ttl: 2592000000
    # 请求头字段名
    token-name: authorization
